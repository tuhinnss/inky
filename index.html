<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Write arithmetic by hand and get the answer inline. Runs entirely on your device."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafbf7" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>CalcInk</title>
    <script>
      // The theme before the first paint, so dark paper never flashes white: the one
      // chosen on this device, or else the device's own. src/ui/theme.ts takes over.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('calcink.theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
